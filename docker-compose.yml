# Local dev / on-box deployment — builds images from source.
# Use docker-compose.prod.yml on the VPS to pull pre-built images from GHCR.

name: deliveryapp

services:
  db:
    image: postgres:16-alpine
    container_name: deliveryapp-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-delivery_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-delivery_db}"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [app_net]

  api:
    build:
      context: .
      dockerfile: DeliveryApp.API/Dockerfile
    image: deliveryapp-api:local
    container_name: deliveryapp-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      # Container time zone — used by DateTime.Now (BackupScheduler, OrderService.IsLocked).
      TZ: Asia/Ho_Chi_Minh
      ConnectionStrings__DefaultConnection: >-
        Host=db;Port=5432;Database=${POSTGRES_DB:-delivery_db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}
      Jwt__Secret: ${JWT_SECRET:?JWT_SECRET is required (>=64 chars)}
      Jwt__Issuer: ${JWT_ISSUER:-DeliveryApp}
      Jwt__Audience: ${JWT_AUDIENCE:-DeliveryApp}
      Cors__Origins__0: ${PUBLIC_ORIGIN:-http://localhost}
      SePay__ApiKey: ${SEPAY_API_KEY:-}
      AI__Provider: ${AI_PROVIDER:-openrouter}
      AI__Model:    ${AI_MODEL:-deepseek/deepseek-chat-v3.1}
      AI__ApiKey:   ${AI_API_KEY:-}
      R2__BucketName: ${R2_BUCKET:-}
      R2__Endpoint:   ${R2_ENDPOINT:-}
      R2__AccessKey:  ${R2_ACCESS_KEY:-}
      R2__SecretKey:  ${R2_SECRET_KEY:-}
      Backup__Directory: /backups
      Backup__AutoEnabled: "true"
      Backup__Time: ${BACKUP_TIME:-02:00}
      Backup__Retention: ${BACKUP_RETENTION:-14}
    volumes:
      - api_wwwroot:/app/wwwroot      # uploaded photos
      - api_backups:/backups           # nightly pg_dump output
    networks: [app_net]

  web:
    build:
      context: .
      dockerfile: shipper-frontend/Dockerfile
    image: deliveryapp-web:local
    container_name: deliveryapp-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-80}:80"
    networks: [app_net]

networks:
  app_net:
    driver: bridge

volumes:
  db_data:
  api_wwwroot:
  api_backups:
