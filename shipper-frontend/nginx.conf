# nginx config for the shipper-frontend container.
# The "api" hostname resolves via docker-compose network to the .NET API service.
#
# In production, Caddy sits in front of this container and terminates TLS.
# We honor the X-Forwarded-Proto Caddy sets; for local dev (no Caddy)
# we fall back to nginx's own $scheme.

map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    ~.+     $http_x_forwarded_proto;
}

upstream backend_api {
    server api:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Larger client uploads (Excel imports, photos)
    client_max_body_size 50m;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    root /usr/share/nginx/html;
    index index.html;

    # ── API reverse-proxy ────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend_api/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 120s;
    }

    # ── SignalR / WebSocket hub ──────────────────────────────
    location /hubs/ {
        proxy_pass         http://backend_api/hubs/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 3600s;     # long-lived connections
        proxy_send_timeout 3600s;
    }

    # ── Backend-served static photos (uploaded files) ────────
    location /uploads/ {
        proxy_pass         http://backend_api/uploads/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # ── Static assets — long cache, immutable hashes ─────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── SPA fallback ─────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
