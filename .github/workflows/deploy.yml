name: Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'DeliveryApp.API/**'
      - 'shipper-frontend/**'
      - 'docker-compose*.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}
  IMAGE_API: deliveryapp-api
  IMAGE_WEB: deliveryapp-web

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: |
          OWNER_LC=$(echo "${{ env.OWNER }}" | tr '[:upper:]' '[:lower:]')
          echo "owner_lc=$OWNER_LC" >> "$GITHUB_OUTPUT"
          echo "image_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── QEMU for cross-arch builds (linux/arm64 on amd64 runner) ─
      - uses: docker/setup-qemu-action@v3

      # ── API image (multi-arch: amd64 + arm64 for Oracle Ampere) ──
      - name: Build & push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: DeliveryApp.API/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner_lc }}/${{ env.IMAGE_API }}:latest
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner_lc }}/${{ env.IMAGE_API }}:${{ steps.meta.outputs.image_tag }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      # ── Web image (multi-arch) ───────────────────────────
      - name: Build & push Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: shipper-frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner_lc }}/${{ env.IMAGE_WEB }}:latest
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner_lc }}/${{ env.IMAGE_WEB }}:${{ steps.meta.outputs.image_tag }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          port:     ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -euo pipefail
            cd ${{ secrets.VPS_APP_DIR }}

            # Login to GHCR so docker compose pull can fetch private images
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io \
              -u "${{ secrets.GHCR_USERNAME }}" --password-stdin

            # Pin to this build's tag
            export IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }}

            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
